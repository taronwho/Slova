<!doctype html>
<!--
  Rozcestník na kořeni domény.

  Sám o sobě nic nedělá — je tu proto, že adresa taronwho.github.io musí kvůli
  ověření aplikace existovat, a prázdná stránka s chybou 404 vypadá jako
  zapomenutý projekt. Vedle něj leží .well-known/assetlinks.json, kvůli
  kterému celý ten repozitář vznikl.
-->
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slova — české slovní hry</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 140% at 20% 0%, #2a2154 0%, #121028 60%);
        color: #f2f1fa;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .brand {
        font-size: clamp(3rem, 14vw, 5.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .brand .o {
        display: inline-grid;
        place-items: center;
        width: 0.78em;
        height: 0.78em;
        border-radius: 50%;
        background: #5b3df5;
        vertical-align: -0.06em;
      }
      .brand .o i { width: 0.3em; height: 0.3em; border-radius: 50%; background: #fff; }
      p { color: #c8c4e6; margin: 1.2rem 0 2rem; }
      a.go {
        display: inline-block;
        padding: 0.85rem 1.8rem;
        border-radius: 999px;
        background: #5b3df5;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">Sl<span class="o"><i></i></span>va</div>
      <p>Osm českých slovních her. I bez signálu.</p>
      <a class="go" href="./Slova/">Hrát</a>
    </div>
  </body>
</html>
